<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>
<body>
    <h2 class="text-center my-3">Two column layout</h2>
    <div class="container">
        <div class="row">
            <div class="col-md-3 bg-primary text-white ">
                <div class="text-center p-3 m-3">
                Sidebar
                </div>
            </div> 
            <div class="col-md-9 bg-success text-white ">
                <div class="text-center p-3 m-3">
                Content area
                </div>
            </div> 
        </div>
    </div>
    <h2 class="text-center my-3">Four column layout</h2>
    <div class="container">
        <div class="row">
            <div class="col-sm-3 bg-primary text-white ">
                <div class="text-center p-3 m-3">
                Column 1
                </div>
            </div> 
            <div class="col-sm-3 bg-success text-white ">
                <div class="text-center p-3 m-3">
                Column 2
                </div>
            </div>
            <div class="col-sm-3 bg-primary text-white ">
                <div class="text-center p-3 m-3">
                Column 3
                </div>
            </div> 
            <div class="col-sm-3 bg-success text-white ">
                <div class="text-center p-3 m-3">
                Column 4
                </div>
            </div> 
        </div>
    </div>
</body>
</html>
