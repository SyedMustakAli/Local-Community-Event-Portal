<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    <h3>Modal Demonstration</h3>
    <button class="btn btn-success p-3 " data-bs-toggle="modal" data-bs-target="#mymodal"> Click Me</button>
    <div id="mymodal" class="modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Alert</h5>
                    <button class="btn btn-warning btn-close" data-bs-dismiss="modal"> </button>
                </div>
                <div class="modal-body">
                    <p>close the alert popup</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-dark" data-bs-dismiss="modal">close</button>
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
